name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Two commits, not the default one: precommit accepts a PLAN.md stamped with HEAD's
      # parent, and a one-commit checkout has no parent to compare with. CI refused every
      # correctly stamped plan for that reason alone until 2026-09-14.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Deterministic gate: fails the build on tests that assert nothing, use
      # banned waits, or carry unmarked fragile selectors. No API key needed.
      - name: Test quality gate
        run: npm run assert-quality

      - name: Install browsers
        run: npx playwright install --with-deps chromium

      # External apps are excluded by default; they hit third-party sites and must
      # never be able to redden CI.
      - name: Playwright tests
        run: npm test

      # Validates any committed QA report against docs/report-format.md — refuses a
      # blocker without direct evidence, or a PASS resting on claimed evidence.
      # Runs after the tests: a report problem must not skip the test run, which is
      # what turned the first CI failure into a confusing cascade.
      - name: Report format
        if: ${{ !cancelled() }}
        run: npm run check-report -- examples/reports

      # Copies this run into artifacts/runs/ so a flake rate can be read across runs.
      # Before this nothing ran it and two runs sat on disk from a single day, so
      # `npm run flake-rate` had nothing to compute from. Archiving is idempotent — the
      # name comes from the run's own start time — and runs on failure too, because a
      # failing run is the one a flake rate most wants.
      - name: Archive this run
        if: ${{ !cancelled() }}
        run: npm run archive-results

      # Aggregates results, flake and quality findings into a PASS/CONDITIONAL/FAIL
      # verdict. Exits non-zero only on FAIL, so an accepted risk is recorded
      # rather than silently swallowed or treated as a blocker.
      - name: Release gate
        if: ${{ !cancelled() }}
        run: npm run gate

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            artifacts/
          retention-days: 7

  # Agent-backed checks cost tokens and need a secret, so they are a separate
  # job: a fork PR without the secret skips them instead of failing red.
  agents:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A Claude subscription token from `claude setup-token`, not an API key. The SDK
      # accepts either; this repo authenticates CI with the token.
      - name: Check for a credential
        id: key
        run: echo "present=${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Agent smoke — triage a known failure
        if: steps.key.outputs.present == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # A triage run cost $0.16–0.17 on 2026-09-14. The budget stops a run after the
          # turn that crosses the cap, so a cap near the real cost fails a run that worked.
          AGENT_MAX_USD: '0.50'
        run: npm run triage -- examples/failure-403.json

      # A skipped step still shows green, so a skip is said out loud.
      - name: Skipped
        if: steps.key.outputs.present != 'true'
        run: echo "::warning title=No agent ran::CLAUDE_CODE_OAUTH_TOKEN is not set, so the agent smoke was skipped."
